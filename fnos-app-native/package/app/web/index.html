<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>云手机助手</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0f1115;
        color: #e6e8ec;
        font-family: system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; flex-direction: column; }

    /* ── floating settings button + sheet ──────── */
    #device-select, #quality-select, #encoder-select, #audio-encoder-select {
        min-width: 0;
        max-width: 58%;
        height: 40px;
        padding: 0 10px;
        border-radius: 10px;
        border: 1px solid #2a2f3a;
        background: #0f1115;
        color: inherit;
        font-size: 15px;
        appearance: none;
        text-overflow: ellipsis;
    }
    #encoder-select[hidden], #audio-encoder-select[hidden] { display: none; }
    .iconbtn {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid #2a2f3a;
        background: #171b22;
        color: #e6e8ec;
        font-size: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
    }
    .iconbtn:active { background: #232a36; }
    .fab {
        position: fixed;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
        z-index: 8;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid #2a2f3a;
        background: rgba(23, 27, 34, .92);
        backdrop-filter: blur(8px);
        color: #e6e8ec;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(0, 0, 0, .45);
        /* the button doubles as a drag handle, so the browser must not claim
           the gesture for panning or text selection */
        touch-action: none;
        user-select: none;
    }
    .fab:active { background: #232a36; }
    .fab.dragging { transform: scale(1.08); box-shadow: 0 8px 24px rgba(0, 0, 0, .6); }
    /* the keyboard bar's send button lives in the same corner — step over it
       (only while the button still sits in its default corner) */
    #kbdbar:not([hidden]) ~ #btn-settings:not(.placed) {
        bottom: calc(72px + env(safe-area-inset-bottom));
    }
    /* once dragged, the button owns its own coordinates and drops the
       right/bottom anchoring, including the shell-offset rule below */
    #btn-settings.placed {
        left: var(--fab-x);
        top: var(--fab-y);
        right: auto;
        bottom: auto;
    }
    #settings-backdrop {
        position: fixed;
        inset: 0;
        z-index: 9;
        background: rgba(0, 0, 0, .45);
    }
    #settings-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        max-height: 75dvh;
        overflow-y: auto;
        background: #171b22;
        border-radius: 16px 16px 0 0;
        border-top: 1px solid #2a2f3a;
        box-shadow: 0 -8px 24px rgba(0, 0, 0, .5);
        padding-bottom: env(safe-area-inset-bottom);
    }
    @media (min-width: 640px) {
        /* desktop: a centred card instead of a bottom sheet, and the button
           steps aside so it never floats over the shell terminal */
        #settings-sheet {
            left: 50%;
            right: auto;
            bottom: auto;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(420px, 92vw);
            border-radius: 16px;
            border: 1px solid #2a2f3a;
        }
        body.with-shell .fab { right: calc(50% + 16px); }
    }
    #settings-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 12px 4px 16px;
    }
    #settings-title { flex: 1; font-size: 16px; font-weight: 600; }
    #settings-head .iconbtn { width: 32px; height: 32px; font-size: 14px; }
    .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #20252f;
        font-size: 15px;
    }
    .row:last-child { border-bottom: none; }
    .row label { flex: 1; color: #cdd3dd; cursor: pointer; }
    .row .mini {
        min-width: 44px;
        height: 36px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid #2a2f3a;
        background: #0f1115;
        color: inherit;
        font-size: 16px;
        touch-action: manipulation;
    }
    .row .mini:active { background: #232a36; }
    .row .mini.off { opacity: 0.4; }
    /* a row whose only control is a hidden encoder picker is just a label */
    .row:has(> select[hidden]) { display: none; }

    /* ── status badge overlays the stage ───────── */
    #stage-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
        display: flex;
    }
    #status-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 5;
        max-width: 80%;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(15, 17, 21, .72);
        backdrop-filter: blur(6px);
        font-size: 12px;
        line-height: 1.4;
        color: #aab2c0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
    }
    #status-badge.p2p { color: #7ee2a8; }
    #status-badge.error { color: #ff8f8f; pointer-events: auto; white-space: normal; }

    /* ── stage ─────────────────────────────────── */
    #stage {
        flex: 1;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: #000;
    }
    #stage:empty::before {
        content: attr(data-empty-hint);
        color: #4a5160;
        font-size: 14px;
    }
    .screen {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: 100%;
        touch-action: none;
        object-fit: contain;
        position: relative;
        z-index: 1;
    }
    /* P2P video sits visible underneath the canvas so Chrome keeps its
       render pipeline warm; switching just removes the canvas on top */
    .screen-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 0;
        touch-action: none;
    }

    /* ── shell panel ───────────────────────────── */
    /* narrow/portrait: docked at the bottom. wide/landscape: docked to the
       right, where a portrait device screen leaves the space unused */
    body.with-shell #stage { margin-bottom: 55%; }
    #shell-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 55%;
        z-index: 6;
        display: flex;
        flex-direction: column;
        background: #0f1115;
        border-top: 1px solid #2a2f3a;
        box-shadow: 0 -8px 24px rgba(0, 0, 0, .5);
    }
    @media (min-aspect-ratio: 1/1) and (min-width: 640px) {
        /* clean vertical split: the shell takes the right column full height,
           and the screen — plus the keyboard bar under it — stays centred
           within the left column */
        body.with-shell #stage { margin-bottom: 0; }
        body.with-shell #stage-wrap,
        body.with-shell #kbdbar { margin-right: 50%; }
        #shell-panel {
            position: fixed;
            left: auto;
            top: 0;
            bottom: 0;
            right: 0;
            width: 50%;
            height: auto;
            border-top: none;
            border-left: 1px solid #2a2f3a;
            box-shadow: -8px 0 24px rgba(0, 0, 0, .5);
        }
    }
    #shell-panel[hidden] { display: none; }
    #shell-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px 6px 12px;
        border-bottom: 1px solid #2a2f3a;
        font-size: 13px;
        color: #aab2c0;
    }
    #shell-title { flex: 1; }
    #shell-head .iconbtn { width: 32px; height: 32px; font-size: 14px; }
    #terminal { flex: 1; min-height: 0; padding: 4px 0 4px 8px; }

    /* ── keyboard input bar ────────────────────── */
    #kbdbar {
        display: flex;
        gap: 8px;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
        flex: none;
        background: #12151b;
        border-top: 1px solid #2a2f3a;
    }
    #kbdbar[hidden] { display: none; }
    #kbd-input {
        flex: 1;
        min-width: 0;
        height: 40px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid #2a2f3a;
        background: #171b22;
        color: inherit;
        font-size: 16px; /* ≥16px prevents iOS auto-zoom on focus */
    }
    #kbd-send {
        flex: none;
        height: 40px;
        padding: 0 16px;
        border-radius: 10px;
        border: none;
        background: #2f6fed;
        color: #fff;
        font-size: 15px;
        touch-action: manipulation;
    }

    /* ── custom scrcpy options (collapsible) ──── */
    .custom-options {
        border-bottom: 1px solid #20252f;
        padding: 0 0 12px;
    }
    .custom-options > summary {
        list-style: none;
        cursor: pointer;
        padding: 12px 16px;
        font-size: 15px;
        color: #cdd3dd;
        position: relative;
    }
    .opt-count {
        margin-left: 8px;
        font-size: 12px;
        color: #7ea6f5;
    }
    .custom-options > summary::-webkit-details-marker { display: none; }
    .custom-options > summary::after {
        content: "▸";
        position: absolute;
        right: 16px;
        transition: transform .15s ease;
        color: #8b93a1;
    }
    .custom-options[open] > summary::after { transform: rotate(90deg); }
    .opt-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 12px;
        padding: 0 16px 8px;
    }
    .opt-grid label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: #8b93a1;
    }
    .opt-grid input,
    .opt-grid select,
    .opt-extra input {
        height: 34px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid #2a2f3a;
        background: #0f1115;
        color: inherit;
        font-size: 14px;
        appearance: none;
    }
    .opt-grid select { padding-right: 22px; }
    .opt-extra {
        margin: 0 16px 8px;
        border: 1px solid #2a2f3a;
        border-radius: 10px;
        background: #0f1115;
    }
    .opt-extra > summary {
        list-style: none;
        cursor: pointer;
        padding: 8px 12px;
        font-size: 12px;
        color: #8b93a1;
        position: relative;
    }
    .opt-extra > summary::-webkit-details-marker { display: none; }
    .opt-extra > summary::after {
        content: "▸";
        position: absolute;
        right: 12px;
        color: #8b93a1;
    }
    .opt-extra[open] > summary::after { transform: rotate(90deg); }
    .opt-extra-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 0 8px 8px;
    }
    .opt-extra-row {
        display: flex;
        gap: 6px;
        align-items: center;
    }
    .opt-extra-row input { flex: 1; min-width: 0; }
    .opt-extra-row .mini {
        min-width: 32px;
        height: 32px;
        padding: 0 8px;
        font-size: 13px;
    }
    .opt-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 0 16px;
    }

    /* ── remote keys, as tiles inside the sheet ── */
    .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid #20252f;
    }
    .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        height: 64px;
        border-radius: 12px;
        border: 1px solid #2a2f3a;
        background: #0f1115;
        color: #aab2c0;
        font-size: 20px;
        touch-action: manipulation;
    }
    .tile:active { color: #fff; background: #232a36; }
    .tile small { font-size: 11px; color: #8b93a1; }
    .tile.accent { color: #7ea6f5; }
    /* the shell tile only appears once the device reports a shell service */
    .tile[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage-wrap">
    <div id="stage"></div>
    <span id="status-badge" hidden></span>
    <section id="shell-panel" hidden>
        <div id="shell-head">
            <span id="shell-title">shell</span>
            <button id="shell-close" class="iconbtn">✕</button>
        </div>
        <div id="terminal"></div>
    </section>
</div>
<div id="kbdbar" hidden>
    <input id="kbd-input" placeholder="输入文字，回车发送到设备" autocomplete="off" autocapitalize="off">
    <button id="kbd-send">发送</button>
</div>

<button id="btn-settings" class="fab" title="设置">⚙</button>
<div id="settings-backdrop" hidden></div>
<section id="settings-sheet" hidden>
    <header id="settings-head">
        <span id="settings-title">设置</span>
        <button id="settings-close" class="iconbtn" title="关闭">✕</button>
    </header>
    <div class="tiles">
        <button id="btn-power" class="tile" title="电源">⏻<small id="label-power">电源</small></button>
        <button id="btn-back" class="tile" title="返回">◁<small id="label-back">返回</small></button>
        <button id="btn-home" class="tile" title="主页">◯<small id="label-home">主页</small></button>
        <button id="btn-recents" class="tile" title="最近任务">▢<small id="label-recents">最近任务</small></button>
        <button id="btn-kbd" class="tile accent" title="键盘">⌨<small id="label-kbd">键盘</small></button>
        <button id="btn-shell" class="tile accent" title="Shell" hidden>&gt;_<small id="label-shell">Shell</small></button>
    </div>
    <div class="row">
        <label id="label-device" for="device-select">设备</label>
        <select id="device-select"></select>
    </div>
    <div class="row">
        <label id="label-refresh" for="refresh">刷新设备列表</label>
        <button id="refresh" class="mini" title="刷新设备列表">⟳</button>
    </div>
    <div class="row">
        <label id="label-adb-connect" for="adb-host">ADB 连接</label>
        <input type="text" id="adb-host" class="mini" placeholder="IP" style="flex:1;min-width:80px;">
        <input type="number" id="adb-port" class="mini" placeholder="端口" value="5555" style="width:64px;min-width:64px;">
        <button id="adb-connect" class="mini">连接</button>
    </div>
    <div class="row">
        <label id="label-quality" for="quality-select">画质</label>
        <select id="quality-select" title="画质">
            <option value="auto">自动</option>
            <option value="low">流畅</option>
            <option value="medium">平衡</option>
            <option value="high">高清</option>
        </select>
    </div>
    <div class="row">
        <label id="label-encoder" for="encoder-select">视频编码器</label>
        <select id="encoder-select" title="视频编码器" hidden></select>
    </div>
    <div class="row">
        <label id="label-audio-encoder" for="audio-encoder-select">音频编码器</label>
        <select id="audio-encoder-select" title="音频编码器" hidden></select>
    </div>
    <div class="row">
        <label id="label-sound" for="btn-mute">声音</label>
        <button id="btn-mute" class="mini" title="单击静音/取消，长按关闭/打开设备音频">🔇</button>
    </div>
    <div class="row">
        <label id="label-fullscreen" for="btn-fullscreen">全屏</label>
        <button id="btn-fullscreen" class="mini" title="全屏">⛶</button>
        <button id="btn-rotate" class="mini" title="画面方向自动跟随设备旋转；方向不对时点击纠正（90° 步进）">🔄</button>
    </div>
    <details id="custom-options" class="custom-options">
        <summary>
            <span id="label-custom-options">自定义 scrcpy 参数</span>
            <span id="custom-options-count" class="opt-count" hidden></span>
        </summary>
        <div class="opt-grid">
            <label><span>max-size</span><input type="number" id="opt-max-size" min="0" step="1" placeholder="留空跟随画质"></label>
            <label><span>video-bit-rate (Mbps)</span><input type="number" id="opt-video-bit-rate" min="0" step="0.1" placeholder="留空跟随画质"></label>
            <label><span>max-fps (0=不限)</span><input type="number" id="opt-max-fps" min="0" step="1" placeholder="不限"></label>
            <label><span>video-codec</span>
                <select id="opt-video-codec">
                    <option value="">自动</option>
                    <option value="h264">h264</option>
                    <option value="h265">h265</option>
                    <option value="av1">av1</option>
                </select>
            </label>
            <label><span>video-encoder</span><input type="text" id="opt-video-encoder" placeholder="留空自动"></label>
            <label><span>audio-encoder</span><input type="text" id="opt-audio-encoder" placeholder="留空自动"></label>
            <label><span>audio-bit-rate</span><input type="number" id="opt-audio-bit-rate" min="0" step="1000"></label>
            <label><span>screen-off-timeout (ms)</span><input type="number" id="opt-screen-off-timeout" min="0" step="1000"></label>
        </div>
        <details class="opt-extra">
            <summary id="label-opt-extra">其他参数 (键值对)</summary>
            <div id="opt-extra-list" class="opt-extra-list"></div>
            <button id="opt-extra-add" type="button" class="mini">+</button>
        </details>
        <div class="opt-actions">
            <button id="opt-reset" type="button" class="mini">重置</button>
            <button id="opt-apply" type="button" class="mini">应用</button>
        </div>
    </details>
</section>

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm-char-measure-element {
    display: inline-block;
    visibility: hidden;
    position: absolute;
    top: 0;
    left: -9999em;
    line-height: normal;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  font-family: monospace;
  user-select: text;
  white-space: pre;
}

.xterm .xterm-accessibility-tree > div {
  transform-origin: left;
  width: fit-content;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {
    /* Dim should not apply to background, so the opacity of the foreground color is applied
     * explicitly in the generated class and reset to 1 here */
    opacity: 1 !important;
}

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }

.xterm-overline {
    text-decoration: overline;
}

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }

.xterm-strikethrough {
    text-decoration: line-through;
}

.xterm-screen .xterm-decoration-container .xterm-decoration {
	z-index: 6;
	position: absolute;
}

.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
	z-index: 7;
}

.xterm-decoration-overview-ruler {
    z-index: 8;
    position: absolute;
    top: 0;
    right: 0;
    pointer-events: none;
}

.xterm-decoration-top {
    z-index: 2;
    position: relative;
}



/* Derived from vs/base/browser/ui/scrollbar/media/scrollbar.css */

/* xterm.js customization: Override xterm's cursor style */
.xterm .xterm-scrollable-element > .scrollbar {
    cursor: default;
}

/* Arrows */
.xterm .xterm-scrollable-element > .scrollbar > .scra {
	cursor: pointer;
	font-size: 11px !important;
}

.xterm .xterm-scrollable-element > .visible {
	opacity: 1;

	/* Background rule added for IE9 - to allow clicks on dom node */
	background:rgba(0,0,0,0);

	transition: opacity 100ms linear;
	/* In front of peek view */
	z-index: 11;
}
.xterm .xterm-scrollable-element > .invisible {
	opacity: 0;
	pointer-events: none;
}
.xterm .xterm-scrollable-element > .invisible.fade {
	transition: opacity 800ms linear;
}

/* Scrollable Content Inset Shadow */
.xterm .xterm-scrollable-element > .shadow {

	display: none;
}
.xterm .xterm-scrollable-element > .shadow.top {
	display: block;
	top: 0;
	left: 3px;
	height: 3px;

}

	display: block;
	top: 3px;
	left: 0;
	height: 100%;
	width: 3px;
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}
.xterm .xterm-scrollable-element > .shadow.top-left-corner {
	display: block;
	top: 0;
	left: 0;
	height: 3px;
	width: 3px;
}
.xterm .xterm-scrollable-element > .shadow.top.left {
	box-shadow: var(--vscode-scrollbar-shadow, #000) 6px 0 6px -6px inset;
}
